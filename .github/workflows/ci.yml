name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: Vet and test
    runs-on: ubuntu-latest

    # PostgreSQL for the end-to-end test (cmd/e2e_test.go). Same major/minor
    # as the edge sites; the shadow table is a plain table, no TimescaleDB needed.
    services:
      postgres:
        image: postgres:17.9
        env:
          POSTGRES_PASSWORD: e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MODBUS_AGENT_E2E_PG: postgres://postgres:e2e@127.0.0.1:5432/postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Build the binary the same way the release does: go test compiles whole
      # packages, so it would not notice a release build that only fails there.
      - name: Build
        run: go build -o /dev/null ./cmd

      - name: Vet
        run: go vet ./...

      # golangci-lint with the repo's .golangci.yml (default linters plus gofmt).
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      # Unit tests write coverage data to unitcov/; the end-to-end test runs
      # the real binary built with -cover, which writes to e2ecov/. Both run
      # with the race detector (E2E_RACE also builds the binary with -race).
      - name: Test
        run: |
          mkdir -p "$RUNNER_TEMP/unitcov" "$RUNNER_TEMP/e2ecov"
          E2E_RACE=1 MODBUS_AGENT_E2E_COVERDIR="$RUNNER_TEMP/e2ecov" \
            go test -race -count=1 -cover -coverpkg=./... ./... -args -test.gocoverdir="$RUNNER_TEMP/unitcov"

      - name: Coverage summary
        run: |
          mkdir -p "$RUNNER_TEMP/allcov"
          go tool covdata merge -i="$RUNNER_TEMP/unitcov,$RUNNER_TEMP/e2ecov" -o="$RUNNER_TEMP/allcov"
          go tool covdata percent -i="$RUNNER_TEMP/allcov" | tee -a "$GITHUB_STEP_SUMMARY"

      # Per-function listing in the job summary and a line-by-line HTML report
      # as a downloadable artifact, so coverage can be checked without running
      # the tests.
      - name: Coverage report
        run: |
          go tool covdata textfmt -i="$RUNNER_TEMP/allcov" -o="$RUNNER_TEMP/coverage.out"
          go tool cover -html="$RUNNER_TEMP/coverage.out" -o="$RUNNER_TEMP/coverage.html"
          {
            echo "<details><summary>Coverage by function</summary>"
            echo
            echo '```'
            go tool cover -func="$RUNNER_TEMP/coverage.out"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: ${{ runner.temp }}/coverage.html
          retention-days: 30
