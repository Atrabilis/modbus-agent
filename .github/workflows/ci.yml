name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: Vet and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Build the binary the same way the release does: go test compiles whole
      # packages, so it would not notice a release build that only fails there.
      - name: Build
        run: go build -o /dev/null ./cmd

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
